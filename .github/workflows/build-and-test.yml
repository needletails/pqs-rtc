name: PQSRTC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# PQSRTC is iOS / macOS / Android (Skip). There is no Linux product surface:
# Package.swift platforms are iOS 18+ and macOS 15+, WebRTC is Apple-only,
# and Skip plugins do not produce a Linux library.

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      required_macos_major: '26'
      required_xcode_major: '26'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Require macOS 26
        shell: bash
        run: |
          set -euo pipefail
          echo "Expecting macOS major: ${required_macos_major}"
          MACOS_VERSION=$(sw_vers -productVersion)
          echo "macOS $MACOS_VERSION"
          MACOS_MAJOR=$(echo "$MACOS_VERSION" | cut -d. -f1)
          if [[ "$MACOS_MAJOR" != "${required_macos_major}" ]]; then
            echo "macOS ${required_macos_major} is required on this runner. Found: macOS $MACOS_VERSION" >&2
            exit 1
          fi

      - name: Require Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          echo "Expecting Xcode major: ${required_xcode_major}"
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          XCODE_VERSION_LINE="${XCODE_VERSION_OUTPUT%%$'\n'*}"
          echo "$XCODE_VERSION_LINE"
          XCODE_MAJOR=$(echo "$XCODE_VERSION_LINE" | awk '{print $2}' | cut -d. -f1)
          if [[ "$XCODE_MAJOR" != "${required_xcode_major}" ]]; then
            echo "Xcode ${required_xcode_major} is required on this runner. Found: $XCODE_VERSION_LINE" >&2
            exit 1
          fi

      - name: Swift version
        run: |
          swift --version
          xcrun swift --version

      - name: Install Skip.tools
        run: |
          brew install skiptools/skip/skip
          skip version

      - name: Cache Swift build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build tests (Release)
        timeout-minutes: 12
        run: swift build --configuration release --build-tests

      # Swift Testing parallelizes in-process by default and deadlocks when
      # many RTCPeerConnections start at once on GitHub-hosted macOS.
      - name: Test (native Swift)
        timeout-minutes: 5
        run: swift test --configuration release --skip-build --filter PQSRTCCompiledSwiftTests --skip XCSkipTests --no-parallel --experimental-maximum-parallelization-width 1

      - name: Install Swift Android SDK
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | skip android sdk install

      - name: Build Android
        timeout-minutes: 8
        run: skip android build

      - name: Build Android test targets
        timeout-minutes: 8
        run: skip android build --build-tests
